name: Lupine GitHub Actions smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Create tiny workload
        run: |
          cat > train.py <<'PY'
          print("hello from lupine remote runner")
          PY

      - name: Run on Lupine
        uses: lupinemachines/setup-client@juan/simpler
        with:
          command: python train.py
          no-artifacts: "true"
